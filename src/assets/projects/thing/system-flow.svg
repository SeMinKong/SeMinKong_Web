<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">THING human-to-robot hand control system</title>
  <desc id="desc">Twenty-one human hand landmarks flow through MediaPipe, ROS 2, and a safety guard to drive a seven-axis tendon robot hand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1512"/>
      <stop offset="0.55" stop-color="#08100e"/>
      <stop offset="1" stop-color="#111a17"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8ff63" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c8ff63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ec"/>
      <stop offset=".46" stop-color="#91a19a"/>
      <stop offset="1" stop-color="#3b4843"/>
    </linearGradient>
    <linearGradient id="palm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8c8c0"/>
      <stop offset="1" stop-color="#52605a"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#c8ff63" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="28" fill="url(#grid)"/>
  <ellipse cx="1190" cy="468" rx="380" ry="320" fill="url(#glow)"/>

  <g font-family="Arial, sans-serif">
    <text x="78" y="84" fill="#c8ff63" font-size="22" font-weight="700" letter-spacing="5">THING / LIVE RETARGETING</text>
    <text x="78" y="124" fill="#82908a" font-size="17" letter-spacing="2">HUMAN MOTION → GUARDED ROBOT ACTION</text>
    <circle cx="1510" cy="80" r="7" fill="#c8ff63"/>
    <text x="1488" y="118" fill="#82908a" font-size="14" text-anchor="end" letter-spacing="2">ROS 2 · ONLINE</text>
  </g>

  <g transform="translate(96 190)">
    <rect width="390" height="554" rx="24" fill="#111b17" stroke="#405048"/>
    <text x="28" y="44" fill="#91a09a" font-family="Arial, sans-serif" font-size="15" letter-spacing="3">PERCEPTION / JETSON</text>
    <text x="28" y="505" fill="#eef5f1" font-family="Arial, sans-serif" font-size="52" font-weight="700">21</text>
    <text x="104" y="504" fill="#91a09a" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">HAND LANDMARKS</text>
    <text x="28" y="532" fill="#65736d" font-family="Arial, sans-serif" font-size="14">MediaPipe Hands · OpenCV</text>

    <g transform="translate(56 66)" fill="none" stroke="#8ce9dc" stroke-linecap="round" stroke-width="5" stroke-opacity=".74">
      <path d="M142 312 111 261 87 201 76 144 72 91M143 311 135 244 132 170 137 97 147 46M145 311 169 237 184 163 195 96 202 45M148 312 196 253 223 193 239 139 249 91M151 316 208 291 253 260 282 228 302 195M143 312 87 201M143 312 132 170M145 311 184 163M148 312 223 193M151 316 253 260"/>
    </g>
    <g transform="translate(56 66)" fill="#c8ff63" stroke="#0d1512" stroke-width="4">
      <circle cx="143" cy="312" r="9"/><circle cx="111" cy="261" r="7"/><circle cx="87" cy="201" r="7"/><circle cx="76" cy="144" r="7"/><circle cx="72" cy="91" r="8"/>
      <circle cx="135" cy="244" r="7"/><circle cx="132" cy="170" r="7"/><circle cx="137" cy="97" r="7"/><circle cx="147" cy="46" r="8"/>
      <circle cx="169" cy="237" r="7"/><circle cx="184" cy="163" r="7"/><circle cx="195" cy="96" r="7"/><circle cx="202" cy="45" r="8"/>
      <circle cx="196" cy="253" r="7"/><circle cx="223" cy="193" r="7"/><circle cx="239" cy="139" r="7"/><circle cx="249" cy="91" r="8"/>
      <circle cx="208" cy="291" r="7"/><circle cx="253" cy="260" r="7"/><circle cx="282" cy="228" r="7"/><circle cx="302" cy="195" r="8"/>
    </g>
  </g>

  <g transform="translate(533 255)" font-family="Arial, sans-serif">
    <path d="M0 200H92" stroke="#c8ff63" stroke-width="3"/>
    <path d="m81 188 13 12-13 12" fill="none" stroke="#c8ff63" stroke-width="3"/>
    <rect x="113" y="0" width="292" height="400" rx="24" fill="#0e1714" stroke="#405048"/>
    <text x="143" y="48" fill="#91a09a" font-size="14" letter-spacing="3">CONTROL PATH</text>
    <g transform="translate(143 86)">
      <rect width="232" height="68" rx="12" fill="#17231e" stroke="#53625b"/>
      <circle cx="29" cy="34" r="8" fill="#8ce9dc"/>
      <text x="50" y="29" fill="#eef5f1" font-size="16" font-weight="700">HandCommand</text>
      <text x="50" y="49" fill="#798781" font-size="13">thumb 3 + fingers 4</text>
      <path d="M116 68v28" stroke="#53625b" stroke-width="2"/>
      <rect y="96" width="232" height="68" rx="12" fill="#17231e" stroke="#53625b"/>
      <circle cx="29" cy="130" r="8" fill="#c8ff63"/>
      <text x="50" y="125" fill="#eef5f1" font-size="16" font-weight="700">ROS 2 Bridge</text>
      <text x="50" y="145" fill="#798781" font-size="13">command arbitration</text>
      <path d="M116 164v28" stroke="#53625b" stroke-width="2"/>
      <rect y="192" width="232" height="68" rx="12" fill="#17231e" stroke="#c8ff63" stroke-opacity=".7"/>
      <circle cx="29" cy="226" r="8" fill="#ffbd72"/>
      <text x="50" y="221" fill="#eef5f1" font-size="16" font-weight="700">Command Guard</text>
      <text x="50" y="241" fill="#798781" font-size="13">limits · E-stop · recovery</text>
    </g>
    <text x="143" y="370" fill="#65736d" font-size="13">Raspberry Pi 5 / SAFETY LAYER</text>
    <path d="M405 200h92" stroke="#c8ff63" stroke-width="3"/>
    <path d="m486 188 13 12-13 12" fill="none" stroke="#c8ff63" stroke-width="3"/>
  </g>

  <g transform="translate(1065 194)" filter="url(#shadow)">
    <g fill="none" stroke="#c8ff63" stroke-opacity=".55" stroke-width="4">
      <path d="M248 343 84 122M261 347 169 69M276 350 273 48M291 351 372 78M302 359 449 157"/>
    </g>
    <g fill="url(#metal)" stroke="#dbe7e1" stroke-opacity=".35" stroke-width="3">
      <rect x="58" y="82" width="47" height="128" rx="22" transform="rotate(-38 82 146)"/>
      <rect x="133" y="30" width="48" height="154" rx="22" transform="rotate(-18 157 107)"/>
      <rect x="241" y="8" width="49" height="171" rx="22" transform="rotate(-2 266 94)"/>
      <rect x="348" y="42" width="48" height="151" rx="22" transform="rotate(18 372 118)"/>
      <rect x="430" y="123" width="46" height="128" rx="22" transform="rotate(39 453 187)"/>
    </g>
    <g fill="#15201c" stroke="#8fa099" stroke-width="3">
      <circle cx="84" cy="122" r="15"/><circle cx="169" cy="69" r="15"/><circle cx="273" cy="48" r="15"/><circle cx="372" cy="78" r="15"/><circle cx="449" cy="157" r="15"/>
    </g>
    <path d="M164 213 367 208 414 340 329 456 190 441 132 334Z" fill="url(#palm)" stroke="#dbe7e1" stroke-opacity=".45" stroke-width="4"/>
    <path d="M184 243 346 239 373 325 310 407 209 397 168 321Z" fill="#1a2521" stroke="#65746d" stroke-width="3"/>
    <path d="M217 254 232 384M265 247v150M314 247l-16 147" stroke="#c8ff63" stroke-opacity=".35" stroke-width="4"/>
    <rect x="222" y="431" width="118" height="91" rx="22" fill="url(#metal)" stroke="#dbe7e1" stroke-opacity=".35" stroke-width="3"/>
    <rect x="242" y="507" width="80" height="61" rx="16" fill="#202d28" stroke="#65746d" stroke-width="3"/>
    <g fill="#c8ff63" stroke="#0b110f" stroke-width="4">
      <circle cx="248" cy="343" r="12"/><circle cx="261" cy="347" r="12"/><circle cx="276" cy="350" r="12"/><circle cx="291" cy="351" r="12"/><circle cx="302" cy="359" r="12"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="1064" y="770" fill="#eef5f1" font-size="52" font-weight="700">7 AXIS</text>
    <text x="1278" y="765" fill="#91a09a" font-size="15" letter-spacing="2">TENDON MOTION</text>
    <text x="1065" y="802" fill="#65736d" font-size="14">DYNAMIXEL XL330 · SAFETY-GUARDED ACTUATION</text>
    <line x1="78" y1="824" x2="1522" y2="824" stroke="#405048"/>
    <text x="78" y="858" fill="#82908a" font-size="14" letter-spacing="2">VISION</text>
    <text x="310" y="858" fill="#82908a" font-size="14" letter-spacing="2">COMMAND</text>
    <text x="589" y="858" fill="#82908a" font-size="14" letter-spacing="2">SAFETY</text>
    <text x="835" y="858" fill="#82908a" font-size="14" letter-spacing="2">ACTUATION</text>
    <text x="1160" y="858" fill="#82908a" font-size="14" letter-spacing="2">OBSERVABILITY + DATA</text>
  </g>
</svg>
